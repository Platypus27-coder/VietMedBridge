[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "vietmedbridge"
version = "0.1.0"
description = "Colab-first, resumable data preparation for ViBioMIR"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datasets==4.4.1",
  "huggingface-hub==0.36.0",
  "pyarrow==21.0.0",
  "duckdb==1.4.1",
  "httpx==0.28.1",
  "trafilatura==2.0.0",
  "beautifulsoup4==4.14.2",
  "pypdf==6.1.1",
  "transformers==4.57.1",
  "tokenizers==0.22.2",
  "langdetect==1.0.9",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29,<8", "nbformat>=5.10,<6", "pandas>=2.2,<3"]
dev = ["pytest>=8.3,<9", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
