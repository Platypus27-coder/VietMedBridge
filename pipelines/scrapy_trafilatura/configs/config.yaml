environment:
  mode: auto
  output_dir: .
  network_probe_url: https://example.com/
  deployment:
    target: windows_local
    provider: local_windows
    region: null
    disk_budget_bytes: 10737418240
    egress_budget_bytes: 5368709120
    stage_b_authorized: true
    stage_b_max_urls: 10000
dataset:
  links_path: data/source/links_corpus.parquet
  query_path: data/source/query.parquet
  id_column: id
  url_column: url
  query_id_column: id
  gold_doc_ids_column: null
  query_required: true
  sample_seed: 42
inventory:
  remove_fragments: true
  remove_tracking_params: false
  batch_rows: 10000
sharding:
  urls_per_shard: 100000
  execution: sequential
crawler:
  concurrent_requests: 8
  concurrent_requests_per_domain: 2
  download_timeout: 30
  dns_timeout: 10
  retry_times: 3
  retry_http_codes: [408, 500, 502, 503, 504, 522, 524]
  rate_limit:
    respect_retry_after: true
    default_cooldown_seconds: 60
    max_batch_retries: 3
  autothrottle:
    enabled: true
    start_delay: 0.5
    max_delay: 60
    target_concurrency: 1.5
  robots_obey: true
  user_agent: ViBioMIR-Research-Retriever/1.0
  max_response_bytes: 20971520
  warn_response_bytes: 5242880
  reactor_threadpool_maxsize: 32
  dnscache_enabled: true
  dnscache_size: 100000
  download_slots: {}
raw_store:
  layout: loose_files
  compression: zstd
  compression_level: 1
extraction:
  workers: 1
  max_tasks_per_child: 500
  max_inflight_per_worker: 2
  html:
    fast_first: false
    output_format: markdown
    include_formatting: true
    include_comments: false
    include_links: false
    include_tables: true
    min_chars_fast_result: 500
    min_extracted_size: 100
    min_output_size: 1
    max_input_bytes: 10485760
    timeout_seconds: 30
  pdf:
    parser: pymupdf
    max_input_bytes: 52428800
    timeout_seconds: 60
    min_chars_per_page: 20
  text:
    max_input_bytes: 10485760
    timeout_seconds: 30
quality:
  min_chars: 200
  high_min_chars: 1000
  max_replacement_char_ratio: 0.02
  low_handoff_policy: retain_low_without_gold
  handoff_mode: benchmark
language:
  backend: heuristic
  sample_chars: 10000
  low_confidence_label: unknown
dedup:
  widespread_duplicate_min_urls: 100
  widespread_duplicate_min_domains: 5
coverage:
  blocked_review_threshold: 0.10
  stage_a_gold_url_budget: 200
  gold_unavailable_policy: proceed_without_qrels
  inaccessible_policy: defer_for_later
  deferred_domains:
    - www.baidu.com
    - pmc-ecm-healthblog.beta.pharmacity.io
    - zysjonline.com
storage:
  jsonl_records_per_part: 50000
  parquet_rows_per_part: 100000
  checksum_sample_size: 100
  manual_review_size: 100
