services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${VMB_QDRANT_API_KEY:?Set VMB_QDRANT_API_KEY in the server environment}"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - vmb-qdrant-storage:/qdrant/storage
      - vmb-qdrant-snapshots:/qdrant/snapshots

volumes:
  vmb-qdrant-storage:
  vmb-qdrant-snapshots:
